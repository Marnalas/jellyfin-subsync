name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - 'Directory.Build.props'
      - 'subsync-sidecar/**'
      - '.github/workflows/build-release.yml'
  # Pull requests run the tests only - every release-side job is guarded on
  # the event being a push, so a PR never tags, releases, publishes Pages or
  # pushes an image.
  pull_request:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - 'Directory.Build.props'
      - 'subsync-sidecar/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Plugin unit tests ───────────────────────────────────────────────
  # Deliberately unguarded, so tests also run on pushes that don't bump
  # <Version> (i.e. that won't release), not just on release-worthy ones.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Run tests
        run: dotnet test Jellyfin.Subsync.Starter.Tests/Jellyfin.Subsync.Starter.Tests.csproj --configuration Release

  # ── Sidecar unit tests ──────────────────────────────────────────────
  # The other half of the sidecar protocol. Unguarded for the same reason as
  # `test` above, and on the same Python as the image's base so the suite runs
  # against the interpreter that will actually serve it.
  test-sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subsync-sidecar
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: subsync-sidecar/requirements-dev.txt

      # requirements-dev.txt deliberately omits ffsubsync - see the comments
      # there. The suite puts a stand-in on PATH instead.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  # ── Check if release already exists ─────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version and check tag
        id: check
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "::notice::Tag v${VERSION} already exists — skipping release"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  # ── Build + push the sidecar image ──────────────────────────────────
  # Runs on every push (not just release-worthy ones) so a sidecar-only
  # change still ships a new `latest`, and runs alongside the plugin release
  # job rather than after it. The two suites are the exception: both jobs wait on
  # both of them, because plugin and sidecar ship as one protocol and neither
  # should be published while the other's tests are red.
  # The Docker Hub login happens *before* the build, not just before
  # the push: the Dockerfile's base image is a Docker Hardened Image, which
  # is only pullable by an entitled account, so an anonymous build would
  # already fail on the FROM.
  sidecar:
    needs: [test, test-sidecar, check-version]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/jellyfin-subsync-sidecar
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          SHOULD_RELEASE: ${{ needs.check-version.outputs.should_release }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # `latest` and the commit sha move on every push; the version tag is
          # only published on a release-worthy push, so an already-released
          # image tag is never overwritten with different content.
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            if [ "$SHOULD_RELEASE" = "true" ]; then
              echo "${IMAGE}:${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: subsync-sidecar
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build plugin + create release ──────────────────────────────────
  # Gated on both suites, not just the plugin's. The two halves ship as one
  # protocol - a release that tags and publishes a plugin while the sidecar's
  # own tests or build are failing puts a version out there with nothing
  # known-compatible to talk to, and users auto-update into it.
  build:
    needs: [test, test-sidecar, check-version, build]
    if: github.event_name != 'pull_request' && needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"
          {
            echo "changelog<<EOF"
            git log "$RANGE" --pretty=format:'- %s (#%h) @%an'
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Create plugin package
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "::error::Invalid plugin version: $VERSION"
            exit 1
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p release
          cp Jellyfin.Subsync.Starter/bin/Release/net9.0/Jellyfin.Subsync.Starter.dll release/
          cp Jellyfin.Subsync.Starter/bin/Release/net9.0/Jellyfin.Subsync.Starter.pdb release/
          jq -n \
            --arg version "$VERSION" \
            --arg timestamp "$TIMESTAMP" \
            --arg changelog "$CHANGELOG" \
            '{
              category: "Subtitles",
              changelog: $changelog,
              description: "Automatically re-syncs out-of-sync subtitles using ffsubsync.",
              guid: "6e9cb927-95fc-4ab9-8267-c896060ae50e",
              name: "SubsyncStarter",
              overview: "Syncs the external subtitles in your Jellyfin libraries, using the subsync-sidecar service (ffsubsync) to fix any timing drift. Defaults as a scheduled sweep with a skip-cache so repeat runs are cheap, and doubles as a manual 'Run Now' trigger from Dashboard > Scheduled Tasks.",
              owner: "Marnalas",
              targetAbi: "10.11.0.0",
              timestamp: $timestamp,
              version: $version,
              status: "Active",
              autoUpdate: true,
              imagePath: "",
              assemblies: ["Jellyfin.Subsync.Starter.dll"]
            }' > release/meta.json
          cd release && zip -r ../SubsyncStarter_${VERSION}.zip .

      - name: Calculate checksum
        id: checksum
        run: |
          CHECKSUM=$(md5sum SubsyncStarter_${{ needs.check-version.outputs.version }}.zip | cut -d ' ' -f 1)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Update manifest.json
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          CHECKSUM="${{ steps.checksum.outputs.checksum }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          NEW_ENTRY=$(jq -n \
            --arg ver "$VERSION" \
            --arg cs "$CHECKSUM" \
            --arg ts "$TIMESTAMP" \
            --arg changelog "$CHANGELOG" \
            '{version: $ver, changelog: $changelog, targetAbi: "10.11.0.0", sourceUrl: "https://github.com/Marnalas/jellyfin-subsync/releases/download/v\($ver)/SubsyncStarter_\($ver).zip", checksum: $cs, timestamp: $ts}')

          # Top-level metadata (guid, name, description, overview, owner, category,
          # imageUrl, ...) always comes from the repo's manifest.json, so edits made
          # there are picked up on the next release instead of being silently dropped.
          BASE_METADATA=$(jq '.[0] | del(.versions)' manifest.json)

          # Version history accumulates on GitHub Pages across releases (the repo's
          # manifest.json isn't updated in place after each release), so pull it from
          # the live site when available and fall back to the repo file otherwise
          # (e.g. on the very first release, before Pages has ever been published).
          LIVE_MANIFEST=$(curl -sf https://marnalas.github.io/jellyfin-subsync/manifest.json || echo "")

          if [ -n "$LIVE_MANIFEST" ] && echo "$LIVE_MANIFEST" | jq -e '.[0].versions' > /dev/null 2>&1; then
            EXISTING_VERSIONS=$(echo "$LIVE_MANIFEST" | jq '.[0].versions')
          else
            EXISTING_VERSIONS=$(jq '.[0].versions // []' manifest.json)
          fi

          jq -n --argjson meta "$BASE_METADATA" --argjson entry "$NEW_ENTRY" --argjson existing "$EXISTING_VERSIONS" \
            '[$meta + {versions: (([$entry] + [$existing[] | select(.version != $entry.version)])[:5])}]' \
            > manifest.json.tmp && mv manifest.json.tmp manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Subsync v${{ needs.check-version.outputs.version }}
          files: |
            SubsyncStarter_${{ needs.check-version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Pages content
        run: |
          mkdir -p _pages
          cp manifest.json _pages/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
