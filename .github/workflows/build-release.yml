name: Build and Release

on:
  push:
    branches: [main, '10.11', 'feature/**', 'hotfix/**']
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - 'Directory.Build.props'
      - 'subsync-sidecar/**'
      - '.github/workflows/build-release.yml'
  # Pull requests run the tests only - every release-side job is guarded on
  # the event being a push, so a PR never tags, releases, publishes Pages or
  # pushes an image.
  pull_request:
    branches: [main, '10.11']
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - 'Directory.Build.props'
      - 'subsync-sidecar/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Resolve which Jellyfin/.NET channel is building ──────────────────
  # `10.11` is the frozen hotfix line (dotnet 9 / net9.0 / Jellyfin 10.11 ABI);
  # everything else (currently just `main`) is the ongoing Jellyfin 12 line
  # (dotnet 10 / net10.0). `github.ref_name` is the branch on push/dispatch,
  # but on pull_request it's the synthetic merge ref, so the PR's target
  # branch (`base_ref`) is used instead.
  # `feature/*` and `hotfix/*` branches build against whichever channel they
  # declare in their name (feature/10.11/x, feature/main/x, ...) and are
  # flagged as `is_test` so downstream jobs route them to the testing
  # manifest/tags instead of production.
  channel:
    runs-on: ubuntu-latest
    outputs:
      dotnet_version: ${{ steps.detect.outputs.dotnet_version }}
      tfm: ${{ steps.detect.outputs.tfm }}
      target_abi: ${{ steps.detect.outputs.target_abi }}
      is_test: ${{ steps.detect.outputs.is_test }}
    steps:
      - name: Detect channel
        id: detect
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          IS_TEST=false
          if [ "$BRANCH" = "10.11" ]; then
            TARGET_CHANNEL=10.11
          elif [[ "$BRANCH" =~ ^(feature|hotfix)/10\.11(/|$) ]]; then
            TARGET_CHANNEL=10.11
            IS_TEST=true
          elif [[ "$BRANCH" =~ ^(feature|hotfix)/main(/|$) ]]; then
            TARGET_CHANNEL=main
            IS_TEST=true
          elif [[ "$BRANCH" =~ ^(feature|hotfix)/ ]]; then
            echo "::warning::Branch '$BRANCH' doesn't declare a target channel (expected feature|hotfix/10.11/... or feature|hotfix/main/...) — defaulting to main"
            TARGET_CHANNEL=main
            IS_TEST=true
          else
            TARGET_CHANNEL=main
          fi

          if [ "$TARGET_CHANNEL" = "10.11" ]; then
            echo "dotnet_version=9.0.x" >> $GITHUB_OUTPUT
            echo "tfm=net9.0" >> $GITHUB_OUTPUT
            echo "target_abi=10.11.0.0" >> $GITHUB_OUTPUT
          else
            echo "dotnet_version=10.0.x" >> $GITHUB_OUTPUT
            echo "tfm=net10.0" >> $GITHUB_OUTPUT
            echo "target_abi=12.0.0.0" >> $GITHUB_OUTPUT
          fi
          echo "is_test=$IS_TEST" >> $GITHUB_OUTPUT

  # ── Plugin unit tests ───────────────────────────────────────────────
  # Deliberately unguarded, so tests also run on pushes that don't bump
  # <Version> (i.e. that won't release), not just on release-worthy ones.
  test:
    needs: [channel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.channel.outputs.dotnet_version }}

      - name: Run tests
        run: dotnet test Jellyfin.Subsync.Starter.Tests/Jellyfin.Subsync.Starter.Tests.csproj --configuration Release

  # ── Sidecar unit tests ──────────────────────────────────────────────
  # The other half of the sidecar protocol. Unguarded for the same reason as
  # `test` above, and on the same Python as the image's base so the suite runs
  # against the interpreter that will actually serve it.
  test-sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subsync-sidecar
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: subsync-sidecar/requirements-dev.txt

      # requirements-dev.txt deliberately omits ffsubsync - see the comments
      # there. The suite puts a stand-in on PATH instead.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  # ── Check if release already exists ─────────────────────────────────
  # The manifest version always matches <Version> verbatim - on test channels
  # (feature/*, hotfix/*) just as on main/10.11, it's the pusher's job to bump
  # it before a push that should produce a new release. Test and production
  # tags live in separate namespaces (test-v* vs v*), so the two channels'
  # tag-existence checks (and therefore "already released?" state) never
  # collide even when both happen to hold the same <Version> at once.
  check-version:
    needs: [channel]
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version and check tag
        id: check
        env:
          IS_TEST: ${{ needs.channel.outputs.is_test }}
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [ "$IS_TEST" = "true" ]; then
            TAG="test-v${VERSION}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "::notice::Tag ${TAG} already exists — skipping release"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  # ── Build + push the sidecar image ──────────────────────────────────
  # Runs on every push (not just release-worthy ones) so a sidecar-only
  # change still ships a new `latest`, and runs alongside the plugin release
  # job rather than after it. The two suites are the exception: both jobs wait on
  # both of them, because plugin and sidecar ship as one protocol and neither
  # should be published while the other's tests are red.
  # The Docker Hub login happens *before* the build, not just before
  # the push: the Dockerfile's base image is a Docker Hardened Image, which
  # is only pullable by an entitled account, so an anonymous build would
  # already fail on the FROM.
  sidecar:
    needs: [channel, test, test-sidecar, check-version]
    if: github.event_name != 'pull_request' && needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/jellyfin-subsync-sidecar
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          SHOULD_RELEASE: ${{ needs.check-version.outputs.should_release }}
          VERSION: ${{ needs.check-version.outputs.version }}
          IS_TEST: ${{ needs.channel.outputs.is_test }}
        run: |
          # `latest` and the commit sha move on every push; the version tag is
          # only published on a release-worthy push, so an already-released
          # image tag is never overwritten with different content.
          # Test-channel (feature/*, hotfix/*) pushes never touch `latest` or a
          # version tag - they roll a `preview` tag instead, so a test push can
          # never disturb the image other installs pull.
          {
            echo "tags<<EOF"
            if [ "$IS_TEST" = "true" ]; then
              echo "${IMAGE}:preview"
              echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            else
              echo "${IMAGE}:latest"
              echo "${IMAGE}:sha-${GITHUB_SHA::7}"
              if [ "$SHOULD_RELEASE" = "true" ]; then
                echo "${IMAGE}:${VERSION}"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ steps.tags.outputs.tags }}
          flavor: |
            latest=${{ needs.channel.outputs.is_test == 'true' && 'false' || 'true' }}
          labels: |
            org.opencontainers.image.title=Subsync Sidecar
            org.opencontainers.image.description=Automatically re-syncs out-of-sync subtitles using ffsubsync.labels: |
            org.opencontainers.image.source=https://github.com/Marnalas/jellyfin-subsync
            org.opencontainers.image.documentation=https://github.com/Marnalas/jellyfin-subsync
          annotations: |
            org.opencontainers.image.readme-file=README.md

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: subsync-sidecar
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      # - name: Update Docker Hub repository metadata
      #   run: |
      #     # Escape quotes in README
      #     DESCRIPTION=$(sed 's/"/\\"/g' README.md)

      #     # Set short description
      #     SHORT_DESC="Sidecar service for Jellyfin Subsync. Automatically re-syncs out-of-sync subtitles using ffsubsync."

      #     # Set category (must be one of Docker Hub’s allowed categories)
      #     CATEGORY="Media"

      #     curl -X PATCH \
      #       -H "Content-Type: application/json" \
      #       -H "Authorization: Bearer ${{ secrets.DOCKERHUB_TOKEN }}" \
      #       -d "{
      #         \"full_description\": \"$DESCRIPTION\",
      #         \"short_description\": \"$SHORT_DESC\",
      #         \"category\": \"$CATEGORY\"
      #       }" \
      #       https://hub.docker.com/v2/repositories/${{ env.IMAGE }}



  # ── Build plugin + create release ──────────────────────────────────
  # Gated on both suites, not just the plugin's. The two halves ship as one
  # protocol - a release that tags and publishes a plugin while the sidecar's
  # own tests or build are failing puts a version out there with nothing
  # known-compatible to talk to, and users auto-update into it.
  build:
    needs: [channel, test, test-sidecar, check-version, sidecar]
    if: github.event_name != 'pull_request' && needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.channel.outputs.dotnet_version }}

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"
          {
            echo "changelog<<EOF"
            git log "$RANGE" --pretty=format:'- %s (#%h) @%an'
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Create plugin package
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          TFM: ${{ needs.channel.outputs.tfm }}
          TARGET_ABI: ${{ needs.channel.outputs.target_abi }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "::error::Invalid plugin version: $VERSION"
            exit 1
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p release
          cp Jellyfin.Subsync.Starter/bin/Release/${TFM}/Jellyfin.Subsync.Starter.dll release/
          cp Jellyfin.Subsync.Starter/bin/Release/${TFM}/Jellyfin.Subsync.Starter.pdb release/
          jq -n \
            --arg version "$VERSION" \
            --arg timestamp "$TIMESTAMP" \
            --arg changelog "$CHANGELOG" \
            --arg targetAbi "$TARGET_ABI" \
          <<'EOF' > release/meta.json
          {
            category: "Subtitles",
            changelog: $changelog,
            description: "Automatically re-syncs out-of-sync subtitles using ffsubsync.",
            guid: "6e9cb927-95fc-4ab9-8267-c896060ae50e",
            name: "SubsyncStarter",
            overview: "Syncs the external subtitles in your Jellyfin libraries, using the subsync-sidecar service (ffsubsync) to fix any timing drift. Defaults as a scheduled sweep with a skip-cache so repeat runs are cheap, and doubles as a manual 'Run Now' trigger from Dashboard > Scheduled Tasks.",
            owner: "Marnalas",
            targetAbi: $targetAbi,
            timestamp: $timestamp,
            version: $version,
            status: "Active",
            autoUpdate: true,
            imagePath: "",
            assemblies: ["Jellyfin.Subsync.Starter.dll"]
          }
          EOF
          cd release && zip -r ../SubsyncStarter_${VERSION}.zip .

      - name: Calculate checksum
        id: checksum
        run: |
          CHECKSUM=$(md5sum SubsyncStarter_${{ needs.check-version.outputs.version }}.zip | cut -d ' ' -f 1)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Update manifest
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          TARGET_ABI: ${{ needs.channel.outputs.target_abi }}
          IS_TEST: ${{ needs.channel.outputs.is_test }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          CHECKSUM="${{ steps.checksum.outputs.checksum }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          NEW_ENTRY=$(jq -n \
            --arg ver "$VERSION" \
            --arg cs "$CHECKSUM" \
            --arg ts "$TIMESTAMP" \
            --arg changelog "$CHANGELOG" \
            --arg targetAbi "$TARGET_ABI" \
            --arg tag "$TAG" \
            '{version: $ver, changelog: $changelog, targetAbi: $targetAbi, sourceUrl: "https://github.com/Marnalas/jellyfin-subsync/releases/download/\($tag)/SubsyncStarter_\($ver).zip", checksum: $cs, timestamp: $ts}')

          # Top-level metadata (guid, name, description, overview, owner, category,
          # imageUrl, ...) always comes from the repo's manifest.json, so edits made
          # there are picked up on the next release instead of being silently dropped.
          # Both the production and testing manifests share this metadata (same
          # plugin, same GUID) - only their `versions` history differs.
          BASE_METADATA=$(jq '.[0] | del(.versions)' manifest.json)

          if [ "$IS_TEST" = "true" ]; then
            REL_PATH="testing/manifest.json"
          else
            REL_PATH="manifest.json"
          fi
          LIVE_URL="https://marnalas.github.io/jellyfin-subsync/${REL_PATH}"

          # Version history accumulates on GitHub Pages across releases (the repo's
          # manifest.json isn't updated in place after each release), so pull it from
          # the live site when available. Fall back to the repo file for production
          # (e.g. on the very first release, before Pages has ever been published),
          # or to an empty list for testing (there is no committed fallback for it).
          LIVE_MANIFEST=$(curl -sf "$LIVE_URL" || echo "")

          if [ -n "$LIVE_MANIFEST" ] && echo "$LIVE_MANIFEST" | jq -e '.[0].versions' > /dev/null 2>&1; then
            EXISTING_VERSIONS=$(echo "$LIVE_MANIFEST" | jq '.[0].versions')
          elif [ "$IS_TEST" = "true" ]; then
            EXISTING_VERSIONS='[]'
          else
            EXISTING_VERSIONS=$(jq '.[0].versions // []' manifest.json)
          fi

          # Each channel (targetAbi 10.11.x vs. everything else, i.e. Jellyfin 12+)
          # is capped at 5 versions independently, so a burst of releases on one
          # branch never ages the other branch's releases out of the manifest.
          mkdir -p "_pages/$(dirname "$REL_PATH")"
          jq -n --argjson meta "$BASE_METADATA" --argjson entry "$NEW_ENTRY" --argjson existing "$EXISTING_VERSIONS" '
            ([$entry] + [$existing[] | select(.version != $entry.version)]) as $all
            | ( ([$all[] | select(.targetAbi | startswith("10.11"))][0:5])
              + ([$all[] | select(.targetAbi | startswith("10.11") | not)][0:5])
              ) as $capped
            | ($capped | sort_by(.timestamp) | reverse) as $versions
            | [$meta + {versions: $versions}]
          ' > "_pages/${REL_PATH}"

          # actions/deploy-pages replaces the *entire* site on every deploy, so the
          # channel that wasn't just updated must be copied into _pages/ unchanged -
          # otherwise this deploy would wipe it out. Skipped if it's never been
          # published yet (e.g. the very first testing release).
          if [ "$IS_TEST" = "true" ]; then
            OTHER_REL_PATH="manifest.json"
          else
            OTHER_REL_PATH="testing/manifest.json"
          fi
          OTHER_URL="https://marnalas.github.io/jellyfin-subsync/${OTHER_REL_PATH}"
          OTHER_MANIFEST=$(curl -sf "$OTHER_URL" || echo "")
          if [ -n "$OTHER_MANIFEST" ]; then
            mkdir -p "_pages/$(dirname "$OTHER_REL_PATH")"
            echo "$OTHER_MANIFEST" > "_pages/${OTHER_REL_PATH}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: ${{ needs.channel.outputs.is_test == 'true' && format('Subsync {0} ({1})', needs.check-version.outputs.tag, github.ref_name) || format('Subsync {0}', needs.check-version.outputs.tag) }}
          prerelease: ${{ needs.channel.outputs.is_test }}
          files: |
            SubsyncStarter_${{ needs.check-version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
